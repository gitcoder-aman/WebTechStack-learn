<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random-Password-Generator</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="main">
        <div class="box">
            <span id = "pass-box">Testing</span>
            <div class="row">
                <div class="left">Password Length</div>
                <div class="right">
                    <input type="number" name="" id="total-char" max="30" min="2" value="10">
                </div>
            </div>
            <div class="row">
                <label for="upper-case">
                    <div class="left">Contains uppercase</div>
                </label>
                <div class="right">
                    <input type="checkbox" name="" id="upper-case" checked/>
                </div>
            </div>
            <div class="row">
                <label for="lower-case">
                    <div class="left">Contains Lowercase</div>
                </label>
                <div class="right">
                    <input type="checkbox" name="" id="lower-case"/>
                </div>
            </div>
            <div class="row">
                <label for="number-case">
                    <div class="left">Contains Number</div>
                </label>
                <div class="right">
                    <input type="checkbox" name="" id="number-case">
                </div>
            </div>
            <div class="row">
                <label for="symbol-case">
                    <div class="left">Contains Symbols</div>
                </label>
                <div class="right">
                    <input type="checkbox" name="" id="symbol-case">
                </div>
            </div>
            <div class="row">
                <button id="btn">Generate</button>
            </div>
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>
</html>
